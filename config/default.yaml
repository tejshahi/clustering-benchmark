# Benchmark configuration.
# Dataset paths are relative to the project root.

seed: 42

datasets:
  s2agri:
    name: "S2Agri-10pc-17"
    x_path: "S2Agri-10pc-17/S2Agri-10pc-17_X.npy"
    y_path: "S2Agri-10pc-17/S2Agri-10pc-17_y.npy"
    meta_path: null
    # shape: (5_850_881, 10 bands, 24 timesteps), uint16
    description: "Sentinel-2 agricultural parcel time series, 10 spectral bands x 24 acquisitions."

  timesen2crop:
    name: "TimeSen2Crop"
    x_path: "TimeSen2Crop/TimeSen2Crop_X.npy"
    y_path: "TimeSen2Crop/TimeSen2Crop_y.npy"
    meta_path: "TimeSen2Crop/TimeSen2Crop_meta.npy"
    # shape: (1_135_511, 9 bands, 365 timesteps), float32
    description: "Sentinel-2 parcel time series, 9 spectral bands x 365 daily-gridded acquisitions."

# Subsampling for tractable clustering (full datasets are millions of rows).
sampling:
  n_samples: 20000
  stratify_by_label: true

# Optional: map raw integer class labels -> {"annual", "perennial", "other"}.
# Fill this in per-dataset once the label legend is known; used by
# metrics.py to score clusters against the perennial/annual distinction.
label_groups:
  s2agri: {}
  timesen2crop: {}

preprocessing:
  # "flatten": flatten (bands x timesteps) into one feature vector
  # "band_stats": per-band summary statistics (mean/std/min/max/etc.)
  feature_mode: "band_stats"
  scale: true

clustering:
  n_clusters: 2   # perennial vs annual -> start with 2
  algorithms:
    - kmeans
    - minibatch_kmeans
    - agglomerative
    - gmm
    - dbscan

output_dir: "results"
